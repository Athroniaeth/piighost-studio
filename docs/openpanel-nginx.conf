# OpenPanel en first-party (contourne les bloqueurs type Brave / uBlock).
#
# Contexte : le site est un export statique servi par nginx. Les bloqueurs
# filtrent `openpanel.dev` (script) et parfois les domaines d'analytics. En
# servant `op1.js` ET l'ingestion sous TON domaine (piighost.athroniaeth.cloud),
# les requêtes deviennent first-party et ne sont pas bloquées.
#
# À coller dans le `server { ... }` qui sert piighost.athroniaeth.cloud, AVANT
# le `location /` catch-all. Puis rebuild du site avec ces variables d'env :
#
#   NEXT_PUBLIC_OPENPANEL_CLIENT_ID=66c9779d-9dfb-433c-acda-13ec88907038
#   NEXT_PUBLIC_OPENPANEL_SCRIPT_URL=https://piighost.athroniaeth.cloud/op1.js
#   NEXT_PUBLIC_OPENPANEL_API_URL=https://piighost.athroniaeth.cloud/api/op
#
# Côté dashboard OpenPanel : autoriser l'origine https://piighost.athroniaeth.cloud
# dans les CORS du client (nginx force ce header Origin ci-dessous).

# 1) Le loader op1.js — relayé depuis le CDN OpenPanel (l'API auto-hébergée
#    renvoie 404 sur /op1.js). La query ?v=1.5.1 est transmise automatiquement.
location = /op1.js {
    proxy_pass https://openpanel.dev/op1.js;
    proxy_ssl_server_name on;
    proxy_set_header Host openpanel.dev;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=86400";
}

# 2) L'ingestion des événements — relayée vers l'API OpenPanel auto-hébergée.
#    Le SDK poste sur ${apiUrl}/track => /api/op/track ; le slash final des deux
#    côtés retire le préfixe /api/op, donc /api/op/track -> opapi.../track.
location /api/op/ {
    proxy_pass https://opapi.athroniaeth.cloud/;
    proxy_ssl_server_name on;
    proxy_set_header Host opapi.athroniaeth.cloud;
    # OpenPanel valide l'origine : on la force au domaine autorisé côté client.
    proxy_set_header Origin https://piighost.athroniaeth.cloud;
    # Requête same-origin (piighost -> piighost) : pas de préflight CORS à gérer.
}
