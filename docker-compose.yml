# Coolify deployment.
#
# In Coolify: create a resource → "Docker Compose" → point it at this repo.
# Set the domain on the `web` service in the UI; Coolify wires its proxy to the
# exposed port 80 automatically (no host port is published here on purpose —
# the proxy reaches the container over Coolify's internal network).
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Variables OpenPanel inlinées au build. Définis-les dans les variables
      # d'environnement Coolify ; elles sont interpolées ici puis passées en
      # build-args au Dockerfile. Pour le first-party (contourne les adblockers) :
      #   NEXT_PUBLIC_OPENPANEL_SCRIPT_URL=https://piighost.athroniaeth.cloud/op1.js
      #   NEXT_PUBLIC_OPENPANEL_API_URL=https://piighost.athroniaeth.cloud/api/op
      args:
        NEXT_PUBLIC_OPENPANEL_CLIENT_ID: ${NEXT_PUBLIC_OPENPANEL_CLIENT_ID:-}
        NEXT_PUBLIC_OPENPANEL_SCRIPT_URL: ${NEXT_PUBLIC_OPENPANEL_SCRIPT_URL:-}
        NEXT_PUBLIC_OPENPANEL_API_URL: ${NEXT_PUBLIC_OPENPANEL_API_URL:-}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
