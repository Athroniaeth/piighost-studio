server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Next.js content-hashed assets never change — cache them hard.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Locale-driven routing: the app is exported under /en and /fr. Redirect the
    # bare root and legacy unprefixed paths to their English equivalents. Search
    # engines and returning visitors land on a real localized URL.
    location = / { return 301 /en/; }
    location = /piighost/ { return 301 /en/piighost/; }
    location = /api/ { return 301 /en/api/; }
    location = /chat/ { return 301 /en/chat/; }
    location = /proofreader/ { return 301 /en/proofreader/; }
    location = /philosophy/ { return 301 /en/philosophy/; }
    location = /playground/ { return 301 /en/playground/; }
    location = /playground/detector/ { return 301 /en/playground/detector/; }

    # The file-convention Open Graph images are exported without a file
    # extension (out/en/opengraph-image, out/fr/opengraph-image). They are real
    # PNGs, so force the correct MIME type or crawlers reject them.
    location ~ /opengraph-image$ {
        default_type image/png;
        add_header Content-Type image/png;
    }

    # --- OpenPanel first-party (contourne Brave / uBlock) ---
    # Servir op1.js et l'ingestion sous ce domaine rend les requêtes same-origin,
    # donc non bloquées par les adblockers. Activé côté app via :
    #   NEXT_PUBLIC_OPENPANEL_SCRIPT_URL=https://<domaine>/op1.js
    #   NEXT_PUBLIC_OPENPANEL_API_URL=https://<domaine>/api/op
    # resolver 127.0.0.11 = DNS Docker ; variable dans proxy_pass => résolution
    # à chaque requête (sinon l'IP du CDN est figée au démarrage).

    # Loader op1.js — relayé depuis le CDN (l'API auto-hébergée renvoie 404 dessus).
    location = /op1.js {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $op_script_host "openpanel.dev";
        proxy_pass https://$op_script_host/op1.js;
        proxy_ssl_server_name on;
        proxy_set_header Host openpanel.dev;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400";
    }

    # Ingestion des événements — relayée vers l'API OpenPanel auto-hébergée.
    # Le SDK poste sur ${apiUrl}/track => /api/op/track -> opapi.../track.
    location /api/op/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $op_api_host "opapi.athroniaeth.cloud";
        rewrite ^/api/op/(.*)$ /$1 break;
        proxy_pass https://$op_api_host;
        proxy_ssl_server_name on;
        proxy_set_header Host opapi.athroniaeth.cloud;
        # OpenPanel valide l'origine : la forcer au domaine autorisé côté client.
        proxy_set_header Origin https://piighost.athroniaeth.cloud;
    }

    # The site is exported with trailingSlash: true, so routes map to
    # <path>/index.html. Try the file, then the directory, then a .html
    # sibling; anything unmatched returns a real 404 (served as the exported
    # 404 page below, not a soft 200).
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
