server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Next.js content-hashed assets never change — cache them hard.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Locale-driven routing: the app is exported under /en and /fr. Redirect the
    # bare root and legacy unprefixed paths to their English equivalents. Search
    # engines and returning visitors land on a real localized URL.
    location = / { return 301 /en/; }
    location = /piighost/ { return 301 /en/piighost/; }
    location = /api/ { return 301 /en/api/; }
    location = /chat/ { return 301 /en/chat/; }
    location = /proofreader/ { return 301 /en/proofreader/; }
    location = /philosophy/ { return 301 /en/philosophy/; }
    location = /playground/ { return 301 /en/playground/; }
    location = /playground/detector/ { return 301 /en/playground/detector/; }

    # The file-convention Open Graph images are exported without a file
    # extension (out/en/opengraph-image, out/fr/opengraph-image). They are real
    # PNGs, so force the correct MIME type or crawlers reject them.
    location ~ /opengraph-image$ {
        default_type image/png;
        add_header Content-Type image/png;
    }

    # The site is exported with trailingSlash: true, so routes map to
    # <path>/index.html. Try the file, then the directory, then a .html
    # sibling; anything unmatched returns a real 404 (served as the exported
    # 404 page below, not a soft 200).
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
